    class WebSoundEngine {
      constructor() {
        this.muted = true;
        this.tracks = {
          tryAgain: new Audio("https://github.com/agisacademy17/aset-gim-jagat-data/raw/refs/heads/main/TRY%20AGAIN.mp3"),
          correct: new Audio("https://github.com/agisacademy17/aset-gim-jagat-data/raw/refs/heads/main/JAWABAN%20BENAR.mp3"),
          bgm1_4: new Audio("https://github.com/agisacademy17/aset-gim-jagat-data/raw/refs/heads/main/MUSIK%20DALAM%20GAME.mp3"),
          bgm5: new Audio("https://github.com/agisacademy17/aset-gim-jagat-data/raw/refs/heads/main/MUSIK%20KETIKA%20LEVEL%20TERAKHIR.mp3"),
          victory: new Audio("https://github.com/agisacademy17/aset-gim-jagat-data/raw/refs/heads/main/VICTORY%20GAME.mp3"),
          seruling: new Audio("https://github.com/agisacademy17/aset-gim-jagat-data/raw/refs/heads/main/freesound_community-seruling-sunda-34162.mp3")
        };
        
        // Loop settings
        this.tracks.bgm1_4.loop = true;
        this.tracks.bgm5.loop = true;
        this.tracks.seruling.loop = true;
        this.tracks.victory.loop = false;
        this.tracks.tryAgain.loop = false;
        this.tracks.correct.loop = false;
      }

      setMute(mute) {
        this.muted = mute;
        Object.values(this.tracks).forEach(track => {
          track.muted = mute;
        });
      }

      playClick() {
        if (this.muted) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        } catch (e) {
          console.warn("Click sound error:", e);
        }
      }

      playTryAgain() {
        this.stopAllBGM();
        try {
          this.tracks.tryAgain.currentTime = 0;
          this.tracks.tryAgain.muted = this.muted;
          this.tracks.tryAgain.play().catch(e => console.log("Audio play error", e));
        } catch (e) {}
      }

      playCorrect() {
        this.stopAllBGM();
        try {
          this.tracks.correct.currentTime = 0;
          this.tracks.correct.muted = this.muted;
          this.tracks.correct.play().catch(e => console.log("Audio play error", e));
        } catch (e) {}
      }

      playSeruling() {
        try {
          if (this.tracks.seruling.paused && !this.muted) {
            this.stopAllBGM();
            this.tracks.seruling.currentTime = 0;
            this.tracks.seruling.play().catch(e => console.log("Audio play error", e));
          }
        } catch (e) {}
      }

      stopSeruling() {
        try {
          this.tracks.seruling.pause();
        } catch (e) {}
      }

      playBGM1_4() {
        try {
          if (this.tracks.bgm1_4.paused && !this.muted) {
            this.stopAllBGM();
            this.tracks.bgm1_4.currentTime = 0;
            this.tracks.bgm1_4.play().catch(e => console.log("Audio play error", e));
          }
        } catch (e) {}
      }

      playBGM5() {
        try {
          if (this.tracks.bgm5.paused && !this.muted) {
            this.stopAllBGM();
            this.tracks.bgm5.currentTime = 0;
            this.tracks.bgm5.play().catch(e => console.log("Audio play error", e));
          }
        } catch (e) {}
      }

      playVictory() {
        this.stopAllBGM();
        try {
          this.tracks.victory.currentTime = 0;
          this.tracks.victory.muted = this.muted;
          this.tracks.victory.play().catch(e => console.log("Audio play error", e));
        } catch (e) {}
      }

      stopAllBGM() {
        try {
          this.tracks.bgm1_4.pause();
          this.tracks.bgm5.pause();
          this.tracks.seruling.pause();
        } catch (e) {}
      }
    }

      const [alertCallback, setAlertCallback] = useState(null);

      // Level 1: Sequence Logic
      const [lvl1Sequence, setLvl1Sequence] = useState([]);
      const correctSequence = [
        "Ambil Beras",
        "Cuci Beras",
        "Masukkan Air",
        "Tambahkan Rempah (Sereh & Salam)",
        "Nyalakan Api",
        "Tunggu Masak"
      ];
      const [shuffledLvl1, setShuffledLvl1] = useState([]);

      // Level 2: Data Cleaning Rows
      const [lvl2Crops, setLvl2Crops] = useState([]);

      // Level 3: AI Training Elements
      const aiDataset = [
        { name: "Daun Sirih", category: "Obat", desc: "Sangat baik untuk penyembuhan luar & antiseptik alami." },
        { name: "Daun Jelatang", category: "Beracun", desc: "Menimbulkan gatal-gatal parah jika tersentuh kulit." },
        { name: "Kecapi", category: "Alat Musik", desc: "Alat musik petik Sunda yang menghasilkan nada indah." },
        { name: "Suling Bambu", category: "Alat Musik", desc: "Ditiup untuk mengiringi tembang Sunda yang syahdu." },
        { name: "Daun Kumis Kucing", category: "Obat", desc: "Tanaman herbal untuk melancarkan saluran kemih." }
      ];
      const [lvl3Index, setLvl3Index] = useState(0);
      const [lvl3CorrectCount, setLvl3CorrectCount] = useState(0);

      // Level 4: Big Data Streaming Objects
      const dataPool = [
        { type: "Transportasi", text: "Data Rute Trans Metro Bandung", isGood: true },
        { type: "Layanan Publik", text: "Sensor Air Bersih PDAM", isGood: true },
        { type: "Iklan Spam", text: "Iklan Judi Online Ilegal", isGood: false },
        { type: "Hoaks", text: "Berita Palsu: Danau Bandung Kering Besok", isGood: false }
      ];
      const [currentStreamItem, setCurrentStreamItem] = useState(null);
      const [lvl4Score, setLvl4Score] = useState(0);

      // Level 5: Final Boss Parameters
      const [bossHealth, setBossHealth] = useState(100);
      const [bossStage, setBossStage] = useState(1);
      const [timeLeft, setTimeLeft] = useState(20);
      const [bossMistakes, setBossMistakes] = useState(0); // Track mistakes (Max 3)

      useEffect(() => {
        const savedProfile = safeStorage.getItem("jagat_data_player_profile");
        if (savedProfile) {
          try {
            const parsed = JSON.parse(savedProfile);
            setPlayerName(parsed.name);
            setPlayerClass(parsed.class);
            const findChar = JAWARA_CHARACTERS.find(c => c.name === parsed.avatarName);
            setSelectedChar(findChar || JAWARA_CHARACTERS[0]);
            setScreen('map');
          } catch(e) {}
        }

        const savedScore = safeStorage.getItem("jagat_data_score");
        if (savedScore) setScore(parseInt(savedScore));

        const savedLevels = safeStorage.getItem("jagat_data_unlocked_levels");
        if (savedLevels) {
          try {
            setUnlockedLevels(JSON.parse(savedLevels));
          } catch(e) {}
        }

        const savedUrl = safeStorage.getItem("jagat_data_script_url");
        if (savedUrl) setScriptUrl(savedUrl);

        sounds.setMute(isMuted);
      }, []);

      useEffect(() => {
        sounds.setMute(isMuted);
        
        if (isMuted) {
          sounds.stopAllBGM();
          return;
        }

        // Handle seruling music for story levels, transitioning out when choosing character
        if (screen === 'story-1' || screen === 'story-2') {
          sounds.playSeruling();
        } else if (screen === 'play') {
          sounds.stopSeruling();
          if (learningPhase) {
            // Pause background music during explanation/study phase
            sounds.stopAllBGM();
          } else {
            if (alertOpen) {
              // Pause BGM when popups appear
              sounds.stopAllBGM();
            } else {
              // Play appropriate BGM when studying / playing
              if (activeLevel >= 1 && activeLevel <= 4) {
                sounds.playBGM1_4();
              } else if (activeLevel === 5) {
                sounds.playBGM5();
              }
            }
          }
        } else if (screen === 'ending') {
          sounds.stopSeruling();
          if (alertOpen) {
            sounds.stopAllBGM();
          } else {
            sounds.playVictory();
          }
        } else {
          // Explicitly turn off seruling on character register screen or other screens
          sounds.stopSeruling();
          sounds.stopAllBGM();
        }
      }, [screen, activeLevel, learningPhase, alertOpen, isMuted]);

      useEffect(() => {
        let timer;
        if (screen === 'play' && activeLevel === 5 && !learningPhase) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                triggerBossGameOver();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [screen, activeLevel, learningPhase, bossStage, bossMistakes]);

      const handleAvatarError = (e, name) => {
        e.target.onerror = null;
        e.target.src = `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name || "JD")}&backgroundColor=161F30&textColor=D4AF37`;
      };

      const fireAlert = (title, desc, icon = "✨", callback = null) => {
        setAlertTitle(title);
        setAlertDesc(desc);
        setAlertIcon(icon);
        setAlertCallback(() => callback);
        setAlertOpen(true);
      };

      const closeAlert = () => {
        setAlertOpen(false);
        if (alertCallback) alertCallback();
      };

      const toggleMute = () => {
        const nextMute = !isMuted;
        setIsMuted(nextMute);
        sounds.setMute(nextMute);
      };

      const handleRegister = () => {
        sounds.playClick();
        if (!playerName.trim()) {
          fireAlert("Registrasi Gagal", "Silakan masukkan nama Jawara kamu terlebih dahulu!", "⚠️");
          return;
        }
        if (!playerClass.trim()) {
          fireAlert("Registrasi Gagal", "Silakan tentukan kelas kamu!", "⚠️");
          return;
        }
        if (!selectedChar) {
          fireAlert("Registrasi Gagal", "Silakan pilih salah satu Karakter Jawara!", "⚠️");
          return;
        }

        const profileObj = {
          name: playerName,
          class: playerClass,
          avatarName: selectedChar.name,
          avatarUrl: `https://lh3.googleusercontent.com/d/${selectedChar.driveId}=s0`
        };

        safeStorage.setItem("jagat_data_player_profile", JSON.stringify(profileObj));
        setScreen('map');
      };

      const enterLevel = (lvlId) => {
        sounds.playClick();
        if (!unlockedLevels.includes(lvlId)) return;
        setActiveLevel(lvlId);
        setLearningPhase(true);
        setScreen('play');

        if (lvlId === 1) {
          setLvl1Sequence([]);
          setShuffledLvl1([...correctSequence].sort(() => Math.random() - 0.5));
        } else if (lvlId === 2) {
          setLvl2Crops([
            { id: 1, crop: "Padi", amount: 150, status: "Valid" },
            { id: 2, crop: "Padi", amount: 150, status: "Duplikat" },
            { id: 3, crop: "Singkong", amount: 120, status: "Valid" },
            { id: 4, crop: "Talas", amount: 0, status: "Eror/Kosong" },
            { id: 5, crop: "Jagung", amount: 90, status: "Valid" },
            { id: 6, crop: "Jagung", amount: 90, status: "Duplikat" }
          ]);
        } else if (lvlId === 3) {
          setLvl3Index(0);
          setLvl3CorrectCount(0);
        } else if (lvlId === 4) {
          setLvl4Score(0);
          setCurrentStreamItem(dataPool[Math.floor(Math.random() * dataPool.length)]);
        } else if (lvlId === 5) {
          setBossHealth(100);
          setBossStage(1);
          setTimeLeft(20);
          setBossMistakes(0);
        }
      };

      const gainPangaweruh = (amount, nextLvl) => {
        const newScore = score + amount;
        setScore(newScore);
        safeStorage.setItem("jagat_data_score", newScore);

        if (nextLvl && !unlockedLevels.includes(nextLvl)) {
          const nextLevelsList = [...unlockedLevels, nextLvl];
          setUnlockedLevels(nextLevelsList);
          safeStorage.setItem("jagat_data_unlocked_levels", JSON.stringify(nextLevelsList));
        }
        setScreen('map');
      };

      const addToSequence = (item) => {
        sounds.playClick();
        if (lvl1Sequence.includes(item)) return;
        setLvl1Sequence([...lvl1Sequence, item]);
      };

      const resetLvl1 = () => {
        sounds.playClick();
        setLvl1Sequence([]);
      };

      const checkLvl1 = () => {
        if (lvl1Sequence.length !== correctSequence.length) {
          fireAlert("Algoritma Belum Lengkap", "Kamu harus memilih semua langkah sebelum menjalankan program!", "⚠️");
          return;
        }

        let isCorrect = true;
        for (let i = 0; i < correctSequence.length; i++) {
          if (lvl1Sequence[i] !== correctSequence[i]) {
            isCorrect = false;
            break;
          }
        }

        if (isCorrect) {
          sounds.playCorrect();
          fireAlert(
            "SUCCESS! (Silih Asah)", 
            "Selamat! Algoritma kamu benar. Ibu-ibu desa berhasil menyajikan nasi liwet yang nikmat tanpa gosong. Batu Kecerdasan Pertama berhasil kamu pulihkan!", 
            "🌾",
            () => gainPangaweruh(100, 2)
          );
        } else {
          sounds.playTryAgain();
          fireAlert("EROR: Logika Salah", "Aduh! Nasi liwetnya gosong karena urutannya terbalik! Coba pikirkan kembali, bisakah menyalakan api sebelum air dimasukkan? Yuk reset dan coba lagi.", "❌");
          setLvl1Sequence([]);
        }
      };

      const deleteCropRow = (id) => {
        sounds.playClick();
        setLvl2Crops(lvl2Crops.filter(row => row.id !== id));
      };

      const checkLvl2 = () => {
        const leftovers = lvl2Crops.filter(row => row.status === "Duplikat" || row.status === "Eror/Kosong");
        const valids = lvl2Crops.filter(row => row.status === "Valid");

        if (leftovers.length === 0 && valids.length === 3) {
          sounds.playCorrect();
          fireAlert(
            "BERHASIL! (Silih Asih)", 
            "Hebat! Data pangan di Lumbung (Leuit) Tatar Sunda sekarang bersih dan akurat. Masyarakat tahu persis kapan harus mulai menanam berdasarkan visualisasi data. Batu Kecerdasan Kedua didapatkan!", 
            "🌾",
            () => gainPangaweruh(150, 3)
          );
        } else {
          sounds.playTryAgain();
          fireAlert("DATA MASIH KOTOR", "Oh tidak! Masih ada data palsu, kosong, atau duplikat yang tersisa, atau kamu salah menghapus data valid. Yuk ulangi saringan data!", "❌");
          setLvl2Crops([
            { id: 1, crop: "Padi", amount: 150, status: "Valid" },
            { id: 2, crop: "Padi", amount: 150, status: "Duplikat" },
            { id: 3, crop: "Singkong", amount: 120, status: "Valid" },
            { id: 4, crop: "Talas", amount: 0, status: "Eror/Kosong" },
            { id: 5, crop: "Jagung", amount: 90, status: "Valid" },
            { id: 6, crop: "Jagung", amount: 90, status: "Duplikat" }
          ]);
        }
      };

      const classifyItem = (category) => {
        sounds.playClick();
        const currentObj = aiDataset[lvl3Index];
        let newCorrect = lvl3CorrectCount;
        if (category === currentObj.category) {
          newCorrect += 1;
        }

        const nextIndex = lvl3Index + 1;
        if (nextIndex >= aiDataset.length) {
          const accuracy = Math.round((newCorrect / aiDataset.length) * 100);
          if (accuracy >= 80) {
            sounds.playCorrect();
            fireAlert(
              "AKURASI OPTIMAL! (Silih Asuh)", 
              `Keren! Bot Batara Data kini memiliki kecerdasan klasifikasi sebesar ${accuracy}%. Ia kembali menjaga Curug AI dan memberikan Batu Kecerdasan Ketiga kepada kamu!`, 
              "🤖",
              () => gainPangaweruh(200, 4)
            );
          } else {
            sounds.playTryAgain();
            fireAlert("AKURASI RENDAH", `Akurasi klasifikasi hanya ${accuracy}%. AI masih bisa keliru membedakan tanaman obat dan racun. Latih kembali Bot Batara Data!`, "❌");
            setLvl3Index(0);
            setLvl3CorrectCount(0);
          }
        } else {
          setLvl3CorrectCount(newCorrect);
          setLvl3Index(nextIndex);
        }
      };

      const filterStream = (isGoodAction) => {
        sounds.playClick();
        const isCorrect = isGoodAction === currentStreamItem.isGood;
        let nextScore = lvl4Score;

        if (isCorrect) {
          nextScore += 1;
        } else {
          nextScore = Math.max(0, nextScore - 1);
        }

        if (nextScore >= 5) {
          sounds.playCorrect();
          fireAlert(
            "DASBOR KOTA PULIH!", 
            "Luar biasa, Jawara! Penyaringan Big Data dengan kecepatan kilat (Velocity) telah berhasil menyelamatkan pusat kendali Kota futuristik Tatar Sunda. Batu Kecerdasan Keempat di tanganmu!", 
            "🏙️",
            () => gainPangaweruh(250, 5)
          );
        } else {
          setLvl4Score(nextScore);
          setCurrentStreamItem(dataPool[Math.floor(Math.random() * dataPool.length)]);
        }
      };

      const resetLevel5Challenge = () => {
        setBossHealth(100);
        setBossStage(1);
        setTimeLeft(20);
        setBossMistakes(0);
      };

      const handleAttackBoss = (isCorrect) => {
        sounds.playClick();
        if (isCorrect) {
          const nextHealth = Math.max(0, bossHealth - 20);
          setBossHealth(nextHealth);

          if (bossStage === 5 && nextHealth <= 0) {
            sounds.playVictory();
            fireAlert(
              "PENYELAMATAN BERHASIL! 👑",
              "Selamat! Kamu telah mengalahkan Raksasa Kabut Informasi dan menyatukan kembali kelima batu kecerdasan di Tatar Parahyangan!",
              "🎉",
              () => {
                setScore(prev => prev + 500);
                setScreen('ending');
                syncScore(score + 500);
              }
            );
          } else {
            setBossStage(prev => prev + 1);
            setTimeLeft(20);
          }
        } else {
          const nextMistakes = bossMistakes + 1;
          setBossMistakes(nextMistakes);

          if (nextMistakes >= 3) {
            sounds.playTryAgain();
            resetLevel5Challenge();
            fireAlert(
              "KESEMPATAN HABIS! 💥", 
              "Aduh! Kamu telah salah menjawab sebanyak 3 kali. Raksasa Kabut Informasi menguasai jaringan! Silakan coba lagi tantangan Level 5 dari awal.", 
              "👾"
            );
          } else {
            sounds.playTryAgain();
            fireAlert(
              "JAWABAN SALAH! ❌", 
              `Kurang tepat! Kesempatan tersisa: <b>${3 - nextMistakes}</b> kali lagi. Pikirkan matang-matang sebelum memilih!`, 
              "👾"
            );
          }
        }
      };

      const triggerBossGameOver = () => {
        sounds.playTryAgain();
        const nextMistakes = bossMistakes + 1;
        setBossMistakes(nextMistakes);

        if (nextMistakes >= 3) {
          resetLevel5Challenge();
          fireAlert(
            "WAKTU HABIS & KESEMPATAN HABIS! 💥", 
            "Aduh! Kamu kehabisan waktu/kesempatan sebanyak 3 kali. Raksasa Kabut Informasi menyerang balik! Silakan coba lagi tantangan Level 5 dari awal.", 
            "👾"
          );
        } else {
          setTimeLeft(20);
          fireAlert(
            "WAKTU HABIS! ⏳", 
            `Waktu menjawab habis! Kesempatan tersisa: <b>${3 - nextMistakes}</b> kali lagi.`, 
            "⏳"
          );
        }
      };

      const buyStoreItem = (name, cost) => {
        sounds.playClick();
        if (score >= cost) {
          if (inventory.includes(name)) {
            fireAlert("Gagal", "Kamu sudah memiliki item ini!", "❌");
            return;
          }
          setScore(prev => prev - cost);
          setInventory([...inventory, name]);
          fireAlert("Berhasil", `Kamu telah membeli ${name}! Terima kasih telah melestarikan budaya Sunda.`, "🎉");
        } else {
          fireAlert("Gagal", "Poin Pangaweruh kamu belum mencukupi untuk membeli item ini.", "⚠️");
        }
      };

      const syncScore = (finalScore) => {
        if (!scriptUrl || !playerName) return;

        const payload = {
          name: playerName,
          class: playerClass,
          avatar: selectedChar?.name || "Jawara",
          score: finalScore || score
        };

        fetch(scriptUrl, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        }).catch(e => console.log("Database Sync Offline"));
      };

      const saveScriptSettings = () => {
        sounds.playClick();
        safeStorage.setItem("jagat_data_script_url", scriptUrl);
        setShowIntegration(false);
        fireAlert("Setelan Disimpan", "Tautan database Google Sheets berhasil diperbarui!", "⚙️");
      };

      const restartFullGame = () => {
        sounds.playClick();
        setScore(0);
        setUnlockedLevels([1]);
        setInventory([]);
        setPlayerName('');
        setPlayerClass('');
        setSelectedChar(null);
        safeStorage.removeItem("jagat_data_player_profile");
        safeStorage.removeItem("jagat_data_unlocked_levels");
        safeStorage.removeItem("jagat_data_score");
        setScreen('splash');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-200 overflow-x-hidden selection:bg-yellow-500 selection:text-slate-950">
          
          {/* HEADER / NAVIGATION BAR */}
          <header className="bg-slate-900/90 backdrop-blur-md border-b border-yellow-500/20 p-4 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl overflow-hidden border border-yellow-500/30 flex items-center justify-center bg-slate-950 shadow-[0_0_15px_rgba(212,175,55,0.2)]">
                  <img src="https://lh3.googleusercontent.com/d/191Z02s6sUvzc2R3PJFDLm1hmD8rWkoOy=s0" alt="Logo Jagat Data" className="w-full h-full object-cover" />
                </div>
                <div>
                  <h1 className="text-md md:text-lg font-black tracking-wider text-white">JAGAT DATA</h1>
                  <p className="text-xs text-yellow-500 tracking-widest font-semibold uppercase">Jawara Tatar Sunda</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center justify-center gap-3">
                <button 
                  onClick={toggleMute} 
                  className={`px-3 py-1.5 rounded-lg border text-xs font-bold transition-all flex items-center gap-1 ${!isMuted ? 'text-cyan-400 border-cyan-400/50 bg-cyan-950/20' : 'text-gray-400 border-slate-800 bg-slate-950'}`}
                >
                  {isMuted ? <IconVolumeX /> : <IconVolume2 />}
                  <span>{isMuted ? 'Musik: OFF' : 'Musik: ON'}</span>
                </button>

                <button 
                  onClick={() => { sounds.playClick(); setShowLeaderboard(true); }} 
                  className="px-3 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs font-bold text-yellow-500 hover:border-yellow-500/60 transition-all flex items-center gap-1"
                >
                  <IconTrophy />
                  <span>Peringkat</span>
                </button>

                {playerName && (
                  <div className="flex items-center space-x-3 bg-slate-950 px-3 py-1 rounded-xl border border-slate-800">
                    <img 
                      src={`https://lh3.googleusercontent.com/d/${selectedChar?.driveId}=s0`} 
                      alt="Avatar" 
                      className="w-8 h-8 rounded-full border border-yellow-500/50 object-cover" 
                      onError={(e) => handleAvatarError(e, selectedChar?.name)} 
                    />
                    <div className="text-left">
                      <div className="text-xs font-bold text-white leading-none">{playerName}</div>
                      <div className="text-[9px] text-yellow-500">Kelas {playerClass}</div>
                    </div>
                  </div>
                )}

                <div className="flex items-center space-x-2 bg-slate-950 px-3 py-1.5 rounded-lg border border-yellow-500/20">
                  <span className="text-yellow-500 text-xs font-bold">✨ PANGAWERUH:</span>
                  <span className="text-cyan-400 font-extrabold text-sm md:text-base">{score}</span>
                </div>

                <button 
                  onClick={() => { sounds.playClick(); setShowToko(true); }} 
                  className="bg-gradient-to-r from-yellow-500/20 to-yellow-500 hover:from-yellow-500 text-yellow-500 hover:text-slate-950 px-4 py-1.5 rounded-lg transition-all duration-300 font-bold text-xs md:text-sm border border-yellow-500/50 flex items-center gap-1.5 shadow-[0_0_10px_rgba(212,175,55,0.15)]"
                >
                  <IconShoppingBag />
                  <span>Toko Adat</span>
                </button>
              </div>
            </div>
          </header>

          {/* MAIN GAME CONTAINER */}
          <main className="flex-grow max-w-7xl w-full mx-auto p-4 flex flex-col justify-center">

            {/* SCREEN 1: SPLASH SCREEN */}
            {screen === 'splash' && (
              <section className="relative min-h-[500px] w-full max-w-4xl mx-auto rounded-3xl overflow-hidden border border-yellow-500/30 flex flex-col justify-center items-center p-6 md:p-12 shadow-2xl bg-slate-950">
                <img src="https://lh3.googleusercontent.com/d/1dRYr3ivMps31rb8c2MtRPQuv0uU8pCWc=s0" alt="Latar Belakang Jagat Data" className="absolute inset-0 w-full h-full object-cover z-0 filter brightness-[0.25]" />
                <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/70 to-transparent z-10"></div>
                
                <div className="relative z-20 flex flex-col items-center justify-center space-y-6 max-w-2xl text-center bg-slate-900/90 backdrop-blur-md p-8 rounded-2xl border border-yellow-500/10 shadow-2xl">
                  <div className="relative w-full max-w-md h-44 md:h-56 rounded-2xl overflow-hidden border-2 border-yellow-500/50 shadow-[0_0_20px_rgba(212,175,55,0.2)] bg-slate-950 transition-transform hover:scale-[1.02] duration-300">
                    <img src="https://lh3.googleusercontent.com/d/1dRYr3ivMps31rb8c2MtRPQuv0uU8pCWc=s0" alt="Pusaka Jagat Data" className="w-full h-full object-cover" />
                  </div>

                  <div>
                    <h2 className="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 via-white to-cyan-400 tracking-tight">JAGAT DATA</h2>
                    <h3 className="text-md md:text-lg font-bold text-emerald-400 mt-1 uppercase tracking-widest">Petualangan Jawara Tatar Sunda</h3>
                    <p className="text-xs md:text-sm text-slate-300 mt-4 leading-relaxed">
                      Siapkah kamu menyelamatkan peradaban nusantara kuno dari gempuran siber modern dengan ilmu pemrograman dan analisis data?
                    </p>
                  </div>

                  <div className="flex flex-col sm:flex-row gap-4 w-full justify-center pt-2">
                    <button 
                      onClick={() => {
                        setIsMuted(false);
                        sounds.setMute(false);
                        sounds.playClick();
                        sounds.playSeruling();
                        setScreen('story-1');
                      }} 
                      className="px-6 py-3 bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-amber-500 hover:to-yellow-400 text-slate-950 text-sm font-bold rounded-xl transition-all duration-300 transform hover:scale-105 shadow-[0_0_15px_rgba(212,175,55,0.3)]"
                    >

                            ) : (

                                <span key={index} className="bg-cyan-500/10 text-cyan-400 border border-cyan-400/30 text-xs py-1 px-3 rounded-lg flex items-center gap-1">
                                  {index + 1}. {item}
                                </span>
                              ))
                            )}

                                { id: 2, crop: "Padi", amount: 150, status: "Duplikat" },
                                { id: 3, crop: "Singkong", amount: 120, status: "Valid" },
                                { id: 4, crop: "Talas", amount: 0, status: "Eror/Kosong" },
                                { id: 5, crop: "Jagung", amount: 90, status: "Valid" },
                                { id: 6, crop: "Jagung", amount: 90, status: "Duplikat" }

                          </button>

                    {/* LEVEL 4: BIG DATA STREAM FILTER */}
                    {activeLevel === 4 && currentStreamItem && (
                      <div className="w-full text-center space-y-6">

                          <b>Tugas:</b> Kota tenggelam dalam aliran Mahadata berkecepatan tinggi! <b>Saring Jagat:</b> Loloskan data yang valid & Blokir data hoaks/spam!

                        <div className="h-40 bg-slate-950 border border-slate-800 rounded-xl flex flex-col items-center justify-center p-4 overflow-hidden relative">

                              const isLost = heartId > (3 - bossMistakes);
                              return (
                                <span

                                  className={`text-lg md:text-xl transition-all duration-300 ${isLost ? 'opacity-20 grayscale scale-90' : 'animate-pulse'}`}

                          <div className="w-full h-2 bg-slate-950 rounded-full overflow-hidden border border-slate-800">

                          </div>
                        </div>

                        {/* Boss Stage Quiz Rendering Engine */}
                        <div className="bg-slate-950 border border-yellow-500/20 p-5 rounded-2xl max-w-xl mx-auto text-left space-y-4">
                          {(() => {
                            const currentQuiz = BOSS_QUIZ_DATA[bossStage - 1];
                            if (!currentQuiz) return null;
                            return (
                              <div className="space-y-4">
                                <span className="text-xs text-yellow-500 font-extrabold tracking-widest uppercase block border-b border-slate-800 pb-2">
                                  {currentQuiz.phase}
                                </span>
                                <h4 className="text-sm md:text-base font-bold text-white leading-relaxed">
                                  {currentQuiz.question}
                                </h4>
                                <div className="grid grid-cols-1 gap-3 pt-2">
                                  {currentQuiz.options.map((opt, i) => (
                                    <button 
                                      key={i}
                                      onClick={() => handleAttackBoss(opt.isCorrect)}
                                      className="p-3 bg-slate-900 hover:bg-slate-850 text-xs text-left text-slate-200 rounded-xl border border-slate-800 hover:border-yellow-500/50 transition-all active:scale-[0.98] duration-200"
                                    >
                                      {opt.text}
                                    </button>
                                  ))}
                                </div>
                              </div>
                            );
                          })()}
                        </div>

                        <div className="text-xs text-slate-500 font-bold">Misi Tahap: {bossStage} / 5</div>
                      </div>
                    )}

                  </div>
                )}

              </section>
            )}

            {/* SCREEN 7: FINAL SUCCESS / CELEBRATION */}

                <img src="https://lh3.googleusercontent.com/d/1dRYr3ivMps31rb8c2MtRPQuv0uU8pCWc=s0" alt="Tatar Sunda Kembali Damai" className="absolute inset-0 w-full h-full object-cover z-0 filter brightness-[0.25] contrast-[1.1]" />
                <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent z-10"></div>

                <div className="relative z-20 w-full text-center space-y-6">
                  <div className="bg-slate-900/90 backdrop-blur-md p-6 rounded-2xl border border-yellow-500/20 max-w-2xl mx-auto shadow-xl">
                    <span className="text-xs font-black text-emerald-400 tracking-widest uppercase">🎉 PETUALANGAN SELESAI 🎉</span>
                    <h2 className="text-2xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 via-white to-cyan-400 tracking-wide mt-2">TATAR SUNDA KEMBALI MAKMUR</h2>
                    <p className="text-xs md:text-sm text-slate-300 mt-4 leading-relaxed">
                      Kabut Mahadata yang menyesatkan telah berhasil disirnakan! Berkat kearifan dan kecerdasan data kamu, <b>Pusaka Jagat Data</b> kini kembali memancarkan harmoni. Di bawah lembah yang hijau, anak-anak Tatar Sunda kembali berkumpul riang gembira memainkan Egrang, Galah Asin, dan Congklak. Alunan suara Angklung Bambu yang merdu kembali terdengar selaras menemani tawa riang mereka.
                    </p>
                  </div>

                  <div className="max-w-3xl mx-auto">
                    <h3 className="text-xs font-black text-yellow-500 tracking-widest uppercase mb-4">🏆 5 PUSAKA & BATU KECERDASAN YANG DIPULIHKAN:</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                      <div className="bg-slate-900/90 border border-cyan-500/50 rounded-xl p-3 flex flex-col items-center justify-center shadow-[0_0_10px_rgba(6,182,212,0.1)] text-center">
                        <span className="text-2xl">🟢</span>
                        <h4 className="text-[10px] font-black text-cyan-400 mt-1.5 uppercase leading-tight">Batu Logika</h4>
                        <p className="text-[8px] text-slate-500 mt-0.5">Kampung Algoritma</p>
                      </div>
                      <div className="bg-slate-900/90 border border-emerald-500/50 rounded-xl p-3 flex flex-col items-center justify-center shadow-[0_0_10px_rgba(16,185,129,0.1)] text-center">
                        <span className="text-2xl">🔵</span>
                        <h4 className="text-[10px] font-black text-emerald-400 mt-1.5 uppercase leading-tight">Batu Kemurnian</h4>
                        <p className="text-[8px] text-slate-500 mt-0.5">Leuweung Data</p>
                      </div>
                      <div className="bg-slate-900/90 border border-purple-500/50 rounded-xl p-3 flex flex-col items-center justify-center shadow-[0_0_10px_rgba(168,85,247,0.1)] text-center">
                        <span className="text-2xl">🟣</span>
                        <h4 className="text-[10px] font-black text-purple-400 mt-1.5 uppercase leading-tight">Batu Batara AI</h4>
                        <p className="text-[8px] text-slate-500 mt-0.5">Curug AI</p>
                      </div>
                      <div className="bg-slate-900/90 border border-yellow-500/50 rounded-xl p-3 flex flex-col items-center justify-center shadow-[0_0_10px_rgba(234,179,8,0.1)] text-center">
                        <span className="text-2xl">🟡</span>
                        <h4 className="text-[10px] font-black text-yellow-400 mt-1.5 uppercase leading-tight">Batu Saringan</h4>
                        <p className="text-[8px] text-slate-500 mt-0.5">Kota Mahadata</p>
                      </div>
                      <div className="bg-slate-900/90 border border-yellow-500 rounded-xl p-3 flex flex-col items-center justify-center shadow-[0_0_10px_rgba(212,175,55,0.2)] text-center">

                    >

                    </button>
                  </div>
                </div>
              </section>

          </main>

          {/* ==========================================

          {/* TOKO ADAT MODAL */}
          {showToko && (
            <div className="fixed inset-0 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border-2 border-yellow-500 rounded-2xl max-w-2xl w-full p-6 relative shadow-2xl animate-fadeIn">
                <button onClick={() => setShowToko(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl font-bold">&times;</button>

                    <button onClick={() => buyStoreItem('Tema Batik Megamendung', 200)} className="px-3 py-1 bg-yellow-500/10 hover:bg-yellow-500 text-yellow-500 hover:text-slate-950 font-bold text-xs rounded transition-all duration-300 border border-yellow-500/30">Beli</button>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-center gap-2">

                      <span className="text-xs text-yellow-500 font-bold block mt-1">Harga: 300 Poin</span>
                    </div>
                    <button onClick={() => buyStoreItem('Waditra Angklung Digital', 300)} className="px-3 py-1 bg-yellow-500/10 hover:bg-yellow-500 text-yellow-500 hover:text-slate-950 font-bold text-xs rounded transition-all duration-300 border border-yellow-500/30">Beli</button>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
                    <div>

                      <p className="text-xs text-slate-400 mt-0.5">Gelar kelulusan utama Tatar Sunda</p>
                      <span className="text-xs text-yellow-500 font-bold block mt-1">Harga: 400 Poin</span>
                    </div>
                    <button onClick={() => buyStoreItem('Badge Mahadata Master', 400)} className="px-3 py-1 bg-yellow-500/10 hover:bg-yellow-500 text-yellow-500 hover:text-slate-950 font-bold text-xs rounded transition-all duration-300 border border-yellow-500/30">Beli</button>
                  </div>
                </div>
              </div>

                          <li>Buat spreadsheet baru di Google Drive Anda.</li>
                          <li>Buka menu <b>Ekstensi</b> &gt; <b>Apps Script</b>.</li>
                          <li>Tempelkan kode database Apps Script (salin di bawah ini) ke dalam editor script.</li>
                          <li>Simpan proyek, lalu klik tombol biru <b>Terapkan (Deploy)</b> di kanan atas &gt; pilih <b>Terapkan Baru</b>.</li>
                          <li>Pilih Jenis: <b>Aplikasi Web (Web App)</b>. Setel jalankan sebagai: <i>Saya (Me)</i>, dan Akses: <i>Siapa saja (Anyone)</i>.</li>
                          <li>Salin Tautan Aplikasi Web (Web App URL) yang dihasilkan.</li>
                          <li>Tempelkan tautan URL tersebut di kolom bawah ini dan klik <b>Simpan Setelan</b>.</li>
                        </ol>
                      </div>

                      <div>
                        <span className="block text-[10px] font-bold text-slate-500 mb-1 uppercase">Kode Google Apps Script (.gs):</span>
                        <textarea 
                          readOnly 
                          onClick={(e) => e.target.select()}
                          value={`function doPost(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    if (sheet.getLastRow() === 0) {
      sheet.appendRow(["Tanggal Misi Selesai", "Nama Siswa", "Kelas", "Karakter Pahlawan", "Skor Pangaweruh"]);
    }
    var data = JSON.parse(e.postData.contents);
    var timestamp = new Date();
    sheet.appendRow([timestamp, data.name, data.class, data.avatar, data.score]);
    return ContentService.createTextOutput(JSON.stringify({ "status": "success" })).setMimeType(ContentService.MimeType.JSON);
  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({ "status": "error", "message": error.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}`}
                          className="w-full h-24 bg-slate-900 border border-slate-800 rounded p-2 text-[10px] font-mono text-slate-400 outline-none select-text" 
                        />
                      </div>

                      <div className="flex flex-col sm:flex-row gap-2 pt-2 border-t border-slate-800">
                        <input 
                          type="text" 
                          value={scriptUrl}
                          onChange={(e) => setScriptUrl(e.target.value)}
                          placeholder="https://script.google.com/macros/s/.../exec" 
                          className="flex-grow bg-slate-900 border border-slate-800 focus:border-cyan-400 rounded-xl px-3 py-2 text-xs text-white outline-none transition-colors"
                        />
                        <button onClick={saveScriptSettings} className="px-4 py-2 bg-cyan-500 text-slate-950 font-black text-xs rounded-xl transition-all duration-300 shrink-0 shadow-lg shadow-cyan-500/20">
                          Simpan Setelan
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                {/* Table Container */}
                <div className="overflow-x-auto bg-slate-950 border border-slate-800 rounded-xl flex-grow min-h-[150px]">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-slate-850 border-b border-slate-800 text-[10px] md:text-xs text-yellow-500 uppercase tracking-wider sticky top-0">
                        <th className="p-3 text-center w-16">Peringkat</th>
                        <th className="p-3">Siswa</th>
                        <th className="p-3">Kelas</th>
                        <th className="p-3">Karakter</th>
                        <th className="p-3 text-right">Skor Pangaweruh</th>
                      </tr>
                    </thead>
                    <tbody className="text-xs text-slate-300">
                      <tr className="border-b border-slate-800 hover:bg-slate-900/50 transition-colors">
                        <td className="p-3 text-center font-extrabold text-yellow-500">🥇</td>
                        <td className="p-3 font-semibold text-white">Prabu Cyber</td>
                        <td className="p-3">X-Mipa 1</td>
                        <td className="p-3">Siliwangi</td>
                        <td className="p-3 text-right font-extrabold text-cyan-400">1200</td>
                      </tr>
                      <tr className="border-b border-slate-800 hover:bg-slate-900/50 transition-colors">
                        <td className="p-3 text-center font-extrabold text-slate-300">🥈</td>
                        <td className="p-3 font-semibold text-white">Neng Sarah</td>
                        <td className="p-3">VIII-A</td>
                        <td className="p-3">Kusuma</td>
                        <td className="p-3 text-right font-extrabold text-cyan-400">950</td>
                      </tr>
                      {playerName && (
                        <tr className="border-b border-slate-800 bg-yellow-500/5 transition-colors">
                          <td className="p-3 text-center font-extrabold text-amber-600">🥉</td>
                          <td className="p-3 font-semibold text-white flex items-center gap-1">
                            <span>{playerName}</span>
                            <span className="text-[9px] bg-yellow-500/20 text-yellow-500 px-1 rounded font-bold">Kamu</span>
                          </td>
                          <td className="p-3">{playerClass}</td>
                          <td className="p-3">{selectedChar?.name || "Jawara"}</td>
                          <td className="p-3 text-right font-extrabold text-cyan-400">{score}</td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* PANDUAN BUDAYA MODAL */}
          {showCredit && (
            <div className="fixed inset-0 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border-2 border-yellow-500 rounded-2xl max-w-2xl w-full p-6 relative shadow-2xl animate-fadeIn">
                <button onClick={() => setShowCredit(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
                <div className="text-center mb-4">
                  <h3 className="text-2xl font-black text-yellow-500 flex items-center justify-center gap-2">
                    <span>📖</span>
                    <span>PANDUAN & NILAI BUDAYA</span>
                  </h3>
                  <p className="text-xs text-slate-400">Integrasi Nilai Filosofi Sunda dalam Teknologi</p>
                </div>
                <div className="space-y-4 max-h-[350px] overflow-y-auto text-sm text-slate-300 leading-relaxed pr-2">
                  <div className="border-l-4 border-yellow-500 pl-3 space-y-1">
                    <h4 className="font-extrabold text-white text-xs uppercase tracking-wider">Silih Asih (Saling Mengasihi)</h4>
                    <p className="text-xs text-slate-400">Menggunakan keterampilan teknologi, analisis data, dan kecerdasan buatan untuk membantu sesama, memecahkan masalah kedaulatan pangan, serta melestarikan kearifan lokal Tatar Sunda.</p>
                  </div>
                  <div className="border-l-4 border-cyan-400 pl-3 space-y-1">
                    <h4 className="font-extrabold text-white text-xs uppercase tracking-wider">Silih Asah (Saling Mencerdaskan)</h4>
                    <p className="text-xs text-slate-400">Pembelajaran koding, algoritma, klasifikasi AI, serta analisis Big data yang dirancang menyenangkan dan mudah dipahami siswa agar siap menghadapi era kedaulatan digital.</p>
                  </div>
                  <div className="border-l-4 border-emerald-400 pl-3 space-y-1">
                    <h4 className="font-extrabold text-white text-xs uppercase tracking-wider">Silih Asuh (Saling Membimbing)</h4>
                    <p className="text-xs text-slate-400">Menumbuhkan kesadaran siber yang beretika, memilah berita hoaks, menyaring jutaan data berkecepatan tinggi agar tidak menyesatkan ekosistem sosial Tatar Sunda.</p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* DAFTAR PUSTAKA MODAL */}
          {showDaftarPustaka && (
            <div className="fixed inset-0 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border-2 border-yellow-500 rounded-2xl max-w-2xl w-full p-6 relative shadow-2xl animate-fadeIn">
                <button onClick={() => setShowDaftarPustaka(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl font-bold font-sans">&times;</button>
                <div className="text-center mb-6">
                  <h3 className="text-2xl font-black text-yellow-500 tracking-wide flex items-center justify-center gap-2">
                    <span>📚</span>
                    <span>DAFTAR PUSTAKA</span>
                  </h3>
                  <p className="text-sm text-slate-400 mt-1">Sumber Inspirasi, Rekayasa, dan Referensi Gim</p>
                </div>

                <div className="space-y-4 max-h-[350px] overflow-y-auto pr-2 text-slate-300 text-xs md:text-sm leading-relaxed text-left">
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <p className="font-bold text-white mb-1">1. Google AI. (2026).</p>
                    <p className="text-slate-400 font-medium">Gemini AI Language Model. Konstruksi sistem mekanik gim, logika pemrograman, rekayasa materi edukasi, dan perancangan logo edukatif. Diakses melalui antarmuka Google Gemini.</p>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <p className="font-bold text-white mb-1">2. OpenAI. (2026).</p>
                    <p className="text-slate-400 font-medium">ChatGPT (DALL-E Integration). Pembuatan teks pendukung dan panduan narasi gim. Diakses melalui antarmuka OpenAI.</p>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <p className="font-bold text-white mb-1">3. OpenAI. (2026).</p>
                    <p className="text-slate-400 font-medium">ChatGPT (DALL-E 3). Aset karakter utama, karakter pendukung, dan elemen visual interaktif dalam gim [Aset Digital].</p>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <p className="font-bold text-white mb-1">4. OpenAI. (2026).</p>
                    <p className="text-slate-400 font-medium">ChatGPT (DALL-E 3). Desain latar tempat (background environment) lingkungan gim edukasi [Aset Digital].</p>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <p className="font-bold text-white mb-1">5. Pixabay GmbH. (n.d.).</p>
                    <p className="text-slate-400 font-medium">
                      Pixabay Sound Effects. Efek suara (sound effects) dan musik latar (backsound) interaktif. Diunduh secara legal di bawah Lisensi Pixabay dari {" "}
                      <a href="https://pixabay.com/id/sound-effects/" target="_blank" rel="noopener noreferrer" className="text-cyan-400 underline hover:text-cyan-300">
                        https://pixabay.com/id/sound-effects/
                      </a>
                    </p>
                  </div>
                </div>

                <div className="mt-6 flex justify-center">
                  <button 
                    onClick={() => { sounds.playClick(); setShowDaftarPustaka(false); }} 
                    className="px-6 py-2 bg-yellow-500 text-slate-950 font-black rounded-lg hover:bg-yellow-400 transition-all duration-300 text-sm shadow-[0_0_10px_rgba(212,175,55,0.2)]"
                  >
                    Tutup Daftar Pustaka
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* GENERAL NOTIFICATION MODAL */}
          {alertOpen && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
              <div className="bg-slate-900 border border-yellow-500/50 rounded-2xl max-w-md w-full p-6 text-center shadow-2xl">
                <div className="text-4xl mb-3">{alertIcon}</div>
                <h4 className="text-lg font-black text-white mb-2">{alertTitle}</h4>
                <p className="text-sm text-slate-300 mb-6 leading-relaxed" dangerouslySetInnerHTML={{ __html: alertDesc }} />
                <button 
                  onClick={closeAlert} 
                  className="px-6 py-2 bg-yellow-500 text-slate-950 font-black rounded-lg hover:bg-yellow-400 transition-all duration-300 text-sm shadow-[0_0_10px_rgba(212,175,55,0.2)]"
                >
                  Baik, Mengerti
                </button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-950 border-t border-slate-900 p-4 text-center text-xs text-slate-500">
            <p>© 2026 Jagat Data. Semua Hak Dilindungi. Dibuat dengan kearifan lokal Sunda & Teknologi Masa Depan.</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
